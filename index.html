<script>
let script = [];
let index = 0;
let running = false;

const statusEl = document.getElementById("status");
const textEl = document.getElementById("text");
const play = document.getElementById("play");
const audio = document.getElementById("audio");

async function loadScript() {
    const response = await fetch("/api/script");

    if (!response.ok) {
        throw new Error("Cannot load script");
    }

    script = await response.json();
}

function next() {
    if (index >= script.length) {
        statusEl.textContent = "BROADCAST ENDED";
        textEl.textContent = "🌙 GOOD NIGHT";
        play.textContent = "✓ END OF BROADCAST";
        play.disabled = true;
        return;
    }

    const item = script[index];
    const currentIndex = index++;

    statusEl.textContent = item.title || "NIGHT FM";
    textEl.textContent = item.text;

    /*
     * QUAN TRỌNG:
     * Gán src + play() ngay lập tức.
     * Không fetch trước khi play().
     */
    audio.src = "/api/tts/" + currentIndex;
    audio.load();

    const promise = audio.play();

    if (promise !== undefined) {
        promise.catch(error => {
            console.error("Audio playback error:", error);

            statusEl.textContent = "AUDIO ERROR";
            textEl.textContent =
                "Trình duyệt chặn âm thanh. Hãy bấm PLAY lại.";

            running = false;
            play.disabled = false;
            play.textContent = "▶ PLAY RADIO";
        });
    }
}

audio.addEventListener("ended", () => {
    setTimeout(next, 800);
});

play.addEventListener("click", async () => {
    if (running) return;

    running = true;
    play.disabled = true;
    play.textContent = "● BROADCASTING";

    try {
        if (script.length === 0) {
            await loadScript();
        }

        /*
         * Sau khi load script xong, next() sẽ gán audio
         * và gọi play() ngay lập tức.
         */
        next();

    } catch (error) {
        console.error(error);

        statusEl.textContent = "ERROR";
        textEl.textContent = "Không tải được chương trình.";

        running = false;
        play.disabled = false;
        play.textContent = "↻ TRY AGAIN";
    }
});
</script>
