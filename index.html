<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIGHT FM — 01:40</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07080b;color:#eee8dc;font-family:Georgia;display:grid;place-items:center}.radio{width:min(92%,540px);padding:30px;border:1px solid #393941;border-radius:24px;background:#15161b;box-shadow:0 30px 90px #000}.top{display:flex;justify-content:space-between;font:11px monospace;letter-spacing:3px;color:#999}.on{color:#ff625c}.dot{display:inline-block;width:7px;height:7px;background:#f55;border-radius:50%;margin-right:7px;box-shadow:0 0 12px #f55;animation:b 1s infinite}@keyframes b{50%{opacity:.2}}h1{text-align:center;font-size:64px;font-weight:normal;letter-spacing:8px;margin:28px 0 5px}.sub{text-align:center;color:#888;font:11px monospace;letter-spacing:3px}.freq{text-align:center;margin:24px;font:14px monospace}.screen{min-height:190px;padding:25px;border:1px solid #383940;border-radius:12px;background:#090a0c;text-align:center;display:grid;place-items:center}.status{font:10px monospace;letter-spacing:2px;color:#777;margin-bottom:14px}.text{font-size:21px;line-height:1.7}button{display:block;margin:24px auto 0;border:0;border-radius:99px;padding:14px 27px;background:#ddd5c5;color:#111;font:bold 12px monospace;letter-spacing:2px;cursor:pointer}button:disabled{opacity:.5}.hint{text-align:center;color:#555;font:10px monospace;margin-top:15px}</style></head><body><main class="radio"><div class="top"><span>NIGHT FM</span><span class="on"><i class="dot"></i>ON AIR</span></div><h1>01:40</h1><div class="sub">THE MIDNIGHT FREQUENCY</div><div class="freq">98.7 MHz</div><section class="screen"><div><div class="status" id="status">STANDBY</div><div class="text" id="text">Bấm PLAY để mở chương trình đêm nay.</div></div></section><button id="play">▶ PLAY RADIO</button><div class="hint">LIVE VOICE • ELEVENLABS • NIGHT FM</div><audio id="audio" preload="auto"></audio></main><script>
const lines=[['NIGHT FM — 01:40 AM','Xin chào… bạn đang nghe NIGHT FM, tần số 98.7 MHz.'],['BẢN TIN ĐÊM','Hiện tại là 1 giờ 40 phút sáng.'],['TIN KHẨN','Một người vẫn đang online… và người đó vẫn chưa chịu đi ngủ.'],['BỘ PHẬN KỸ THUẬT','Chúng tôi đã kiểm tra. Não vẫn đang hoạt động bình thường. Tình hình khá nghiêm trọng.'],['CHƯƠNG TRÌNH ĐẶC BIỆT','Vì vậy, NIGHT FM xin phép chuyển sang chương trình: Đêm Nay Ngủ Ngoan.'],['LỜI NHẮN','Không cần nghĩ gì nữa. Không cần check điện thoại thêm.'],['','Cứ nằm xuống… kéo chăn lên… nhắm mắt lại…'],['','Và để phần còn lại cho ngày mai.'],['NIGHT FM','Cảm ơn bạn đã ở lại với NIGHT FM tối nay.'],['BẢN TIN CUỐI','Chúc bạn có một đêm thật yên. Ngủ thật ngon.'],['','Và… đừng thức thêm nữa.']];
const statusEl=document.getElementById('status'),textEl=document.getElementById('text'),play=document.getElementById('play'),audio=document.getElementById('audio');let i=0,running=false;
async function next(){if(i>=lines.length){statusEl.textContent='BROADCAST ENDED';textEl.textContent='🌙 GOOD NIGHT';play.textContent='✓ END OF BROADCAST';play.disabled=true;running=false;return}const n=i++;statusEl.textContent=lines[n][0]||'NIGHT FM';textEl.textContent=lines[n][1];try{const r=await fetch('/api/tts/'+n,{cache:'no-store'});if(!r.ok)throw new Error(await r.text());const blob=await r.blob();if(!blob.size)throw new Error('Empty audio');const url=URL.createObjectURL(blob);audio.src=url;audio.onended=()=>{URL.revokeObjectURL(url);setTimeout(next,800)};await audio.play()}catch(e){console.error(e);statusEl.textContent='AUDIO ERROR';textEl.textContent='Không phát được giọng AI. Kiểm tra Render Logs.';play.disabled=false;play.textContent='↻ THỬ LẠI';running=false}}
play.onclick=()=>{if(running)return;running=true;play.disabled=true;play.textContent='● BROADCASTING';next()};
</script></body></html>
